<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Карточки с кнопками</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header, footer {
      background-color: #2980b9;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    main {
      flex: 1;
      padding: 30px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 300px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-card {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #e67e22;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    footer .footer-buttons {
      margin-top: 10px;
    }

    .footer-buttons button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      background-color: #27ae60;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .footer-buttons button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>Привет, Тосік!</h1>
  </header>

  <main>
    <div class="cards-container">
      <!-- Ряд 1: Карточки 1-6 -->
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 1">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 2">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 3">

      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 4">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 5">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 6">
        <button class="btn-card">Нажми меня</button>
      </div>

      <!-- Ряд 2: Карточки 7-12 -->
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 7">

      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 8">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 9">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 10">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 11">
        <button class="btn-card">Нажми меня</button>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Image 12">
        <button class="btn-card">Нажми меня</button>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Тестовый сайт. Все права защищены.
    <div class="footer-buttons">
      <button>Футер 1</button>
      <button>Футер 2</button>
      <button>Футер 3</button>

    </div>
  </footer>

  <script>
    // Все кнопки карточек
    const buttons = document.querySelectorAll('.btn-card');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        alert(10);
      });
    });

    // Кнопки футера
    const footerButtons = document.querySelectorAll('.footer-buttons button');
    footerButtons.forEach(btn => {

        alert(10);
      });
    });
  </script>

</body>
